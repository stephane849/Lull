name: Release

# Push to the `release` branch to build a signed APK and publish it as a GitHub release.
# The tag (v + versionName from app/build.gradle.kts) is created by this workflow.
on:
  push:
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Read version
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "TAG=v$v" >> "$GITHUB_ENV"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Already released::v$v exists. Bump versionName and versionCode first."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.LULL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LULL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Missing signing key::Add LULL_KEYSTORE_B64 and LULL_KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lull-release.jks"

      - name: Test and build signed APK
        env:
          LULL_KEYSTORE_FILE: ${{ runner.temp }}/lull-release.jks
          LULL_KEYSTORE_PASSWORD: ${{ secrets.LULL_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Lull-${TAG}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "Lull-${TAG}.apk" \
            --target "$GITHUB_SHA" \
            --title "Lull ${TAG}" \
            --notes-file RELEASE_NOTES.md
