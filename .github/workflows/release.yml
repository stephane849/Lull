name: Release

# Push a tag like v1.0.0 to build a signed APK and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.LULL_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LULL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Missing signing key::Add LULL_KEYSTORE_B64 and LULL_KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lull-release.jks"

      - name: Test and build signed APK
        env:
          LULL_KEYSTORE_FILE: ${{ runner.temp }}/lull-release.jks
          LULL_KEYSTORE_PASSWORD: ${{ secrets.LULL_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :core:test :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "Lull-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Lull-${GITHUB_REF_NAME}.apk" \
            --title "Lull ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
